name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint -- --write

      - name: Verify formatting
        run: pnpm format:check
